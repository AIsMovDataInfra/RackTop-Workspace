[package]
name = "racktop"
version = "2.0.0"
description = "Live GPU & CPU monitoring for every server"
# Original author: Tongzh-SEU and upstream contributors; see ../NOTICE.md.
# Linux bundle.publisher supplies the Debian maintainer separately.
edition = "2024"
default-run = "racktop"
autobins = false

[lib]
name = "racktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
integration-probe = ["tauri/test"]

[[bin]]
name = "racktop"
path = "src/main.rs"

[[bin]]
name = "racktop-probe"
path = "src/bin/racktop-probe.rs"
required-features = ["integration-probe"]

[[bin]]
name = "sharing-probe"
path = "src/bin/sharing-probe.rs"
required-features = ["integration-probe"]

[[bin]]
name = "team-setup"
path = "src/bin/team-setup.rs"
required-features = ["integration-probe"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros", "io-util", "net", "sync", "fs"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14.10"
ed25519-dalek = "2.2.0"
rand = "0.8.8"
futures-util = { version = "0.3.33", features = ["sink"] }
rfd = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
thiserror = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
sha2 = "0.10"
semver = "1"
minisign-verify = "0.2"
portable-pty = "0.9.0"
tempfile = "3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
