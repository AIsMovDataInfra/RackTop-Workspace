[package]
name = "racktop"
version = "1.26.0-linux.5"
description = "Live GPU & CPU monitoring for every server"
authors = ["RackTop"]
edition = "2024"
default-run = "racktop"
autobins = false

[lib]
name = "racktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
integration-probe = ["tauri/test"]

[[bin]]
name = "racktop"
path = "src/main.rs"

[[bin]]
name = "racktop-probe"
path = "src/bin/racktop-probe.rs"
required-features = ["integration-probe"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros", "io-util"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
thiserror = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
sha2 = "0.10"
semver = "1"
minisign-verify = "0.2"
portable-pty = "0.9.0"
tempfile = "3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
