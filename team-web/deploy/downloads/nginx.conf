# Place inside the existing HTTPS server block. This directory contains only
# publicly distributable installation packages, source, licenses, and guides.
location = /downloads {
    return 302 /downloads/;
}

location ^~ /downloads/ {
    root /var/www/racktop-public;
    index index.html;
    autoindex off;
    disable_symlinks on;
    try_files $uri $uri/ =404;
    limit_except GET { deny all; }
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600";
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
}
