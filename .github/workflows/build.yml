name: Build RackTop

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: Build macOS Apple Silicon and Intel packages
        required: true
        type: boolean
        default: false
      build_windows:
        description: Build Windows x64 packages
        required: true
        type: boolean
        default: false
      build_linux:
        description: Build Ubuntu 22.04 x64 Debian package
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    if: (github.event_name == 'workflow_dispatch' && inputs.build_linux) || (github.event_name == 'push' && contains(github.ref, '-linux.'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev openssh-client xvfb
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: cargo test --release --locked --lib --manifest-path src-tauri/Cargo.toml
      - name: Check sharing relay and file protocol
        run: |
          npm ci --prefix relay --ignore-scripts
          npm test --prefix relay
          python3 -m unittest discover -s src-tauri/src/sharing -p 'test_remote_files.py'
          RACKTOP_RELAY_DIR="$PWD/relay" cargo test --release --locked --lib --manifest-path src-tauri/Cargo.toml sharing::transport::tests::real_node_relay_reconnects_and_carries_tls_frames -- --ignored
      - run: npm run bundle:linux -- --locked
      - name: Sign Linux updater package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LINUX_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          version=$(node -p "require('./package.json').version")
          python3 scripts/sign-linux-update.py "src-tauri/target/release/bundle/deb/RackTop_${version}_amd64.deb"
          cargo run --release --locked --features integration-probe --bin racktop-probe --manifest-path src-tauri/Cargo.toml -- --verify-update-files "src-tauri/target/release/bundle/deb/RackTop_${version}_amd64.deb" "src-tauri/target/release/bundle/deb/RackTop_${version}_amd64.deb.sig"
          python3 scripts/test-linux-update.py src-tauri/target/release/racktop-probe "src-tauri/target/release/bundle/deb/RackTop_${version}_amd64.deb"
      - name: Inspect package and smoke-test native startup
        shell: bash
        run: |
          set -euo pipefail
          package=(src-tauri/target/release/bundle/deb/*.deb)
          dpkg-deb --info "${package[0]}"
          dpkg-deb --extract "${package[0]}" "$RUNNER_TEMP/racktop-linux"
          ldd "$RUNNER_TEMP/racktop-linux/usr/bin/racktop" | tee "$RUNNER_TEMP/racktop-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/racktop-ldd.txt"; then exit 1; fi
          set +e
          XDG_DATA_HOME="$RUNNER_TEMP/racktop-data" XDG_CONFIG_HOME="$RUNNER_TEMP/racktop-config" XDG_CACHE_HOME="$RUNNER_TEMP/racktop-cache" \
            timeout 15s dbus-run-session -- xvfb-run -a "$RUNNER_TEMP/racktop-linux/usr/bin/racktop"
          status=$?
          set -e
          test "$status" -eq 124
          echo "RACKTOP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: RackTop_${{ env.RACKTOP_VERSION }}_linux-amd64-deb
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sha256
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/deb/linux-amd64.json

  publish-linux:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-linux.')
    needs: linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: linux-release-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: RackTop_*_linux-amd64-deb
          path: release-assets
          merge-multiple: true
      - name: Publish verified release, then update Linux feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-linux-update.py release-assets

  macos:
    if: (github.event_name == 'workflow_dispatch' && inputs.build_macos) || (github.event_name == 'push' && !contains(github.ref, '-linux.'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: brew install minisign
      - run: npm ci
      - name: Read package version
        shell: bash
        run: |
          RACKTOP_VERSION="$(node -p "require('./package.json').version")"
          echo "RACKTOP_VERSION=$RACKTOP_VERSION" >> "$GITHUB_ENV"
      - run: npm run test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --lib --target ${{ matrix.target }}

      - name: Import Apple Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CONFIGURED_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            if [ -n "$APPLE_CERTIFICATE_PASSWORD$NOTARY_APPLE_ID$NOTARY_APPLE_PASSWORD$NOTARY_APPLE_TEAM_ID" ]; then
              echo "Apple signing and notarization secrets are only partially configured." >&2
              exit 1
            fi
            echo "No Apple certificate configured; the artifact will be marked unsigned."
            echo "RACKTOP_MARK_UNSIGNED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$NOTARY_APPLE_ID" ] \
            || [ -z "$NOTARY_APPLE_PASSWORD" ] || [ -z "$NOTARY_APPLE_TEAM_ID" ]; then
            echo "A certificate and all Apple notarization secrets must be configured together." >&2
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/racktop-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/racktop-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$CONFIGURED_SIGNING_IDENTITY"
          if [ -z "$SIGNING_IDENTITY" ]; then
            SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          fi
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No Developer ID Application identity was found in APPLE_CERTIFICATE." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "RACKTOP_MARK_UNSIGNED=0" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify macOS DMG
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RACKTOP_MACOS_TARGET: ${{ matrix.target }}
          RACKTOP_DMG_FINDER_LAYOUT: "0"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LINUX_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run bundle:macos

      - name: Verify both package forms and launch installed application
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          DMG="$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' -print)"
          UPDATER="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app.tar.gz' -print)"
          MODE=ad-hoc
          if [ "${RACKTOP_MARK_UNSIGNED:-1}" = "0" ]; then MODE=developer-id; fi
          VERIFY_ARGS=(
            --target "${{ matrix.target }}" --dmg "$DMG" --updater "$UPDATER"
            --public-key src-tauri/linux-updater.pub --version "$RACKTOP_VERSION"
            --signing-mode "$MODE" --smoke
            --report "$RUNNER_TEMP/macos-${{ matrix.arch }}-verification.json"
            --screenshot "$RUNNER_TEMP/macos-${{ matrix.arch }}.png"
          )
          if [ "$MODE" = developer-id ]; then VERIFY_ARGS+=(--notarized); fi
          python3 scripts/test-macos-package.py "${VERIFY_ARGS[@]}"
      - name: Upload Mac verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-verification
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/macos-${{ matrix.arch }}-verification.json
            ${{ runner.temp }}/macos-${{ matrix.arch }}.png

      - name: Upload verified macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: RackTop_${{ env.RACKTOP_VERSION }}_macos-${{ matrix.arch }}-dmg
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.sha256
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.signing.txt

      - name: Upload verified macOS updater package
        uses: actions/upload-artifact@v4
        with:
          name: RackTop_${{ env.RACKTOP_VERSION }}_macos-${{ matrix.arch }}-updater
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  publish-macos:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-linux.')
    needs: macos
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: macos-release-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: RackTop_*_macos-*
          path: release-assets
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: python3 scripts/test-publish-macos-update.py
      - name: Publish verified release, then update Mac feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-macos-update.py release-assets

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Read package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "RACKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target x86_64-pc-windows-msvc --bundles msi,nsis
          uploadWorkflowArtifacts: false
      - name: Smoke-test Windows installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi' -Filter '*.msi' | Select-Object -First 1
          $nsis = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $msi) { throw 'Windows build did not produce an MSI installer.' }
          if (-not $nsis) { throw 'Windows build did not produce an NSIS setup executable.' }

          $msiExtract = Join-Path $env:RUNNER_TEMP 'racktop-msi-extract'
          $msiArgs = "/a `"$($msi.FullName)`" /qn /norestart TARGETDIR=`"$msiExtract`""
          $msiProcess = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
          if ($msiProcess.ExitCode -ne 0) { throw "MSI administrative install failed with exit code $($msiProcess.ExitCode)." }
          if (-not (Get-ChildItem $msiExtract -Recurse -Filter 'RackTop.exe' -ErrorAction SilentlyContinue)) {
            throw 'MSI did not contain RackTop.exe.'
          }

          $nsisInstall = Join-Path $env:RUNNER_TEMP 'racktop-nsis-install'
          $nsisProcess = Start-Process $nsis.FullName -ArgumentList "/S /D=$nsisInstall" -Wait -PassThru
          if ($nsisProcess.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($nsisProcess.ExitCode)." }
          $app = Get-ChildItem $nsisInstall -Recurse -Filter 'RackTop.exe' | Select-Object -First 1
          if (-not $app) { throw 'NSIS installation did not create RackTop.exe.' }

          $appProcess = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($appProcess.HasExited) { throw "Installed RackTop exited early with code $($appProcess.ExitCode)." }
          Stop-Process -Id $appProcess.Id -Force

          $uninstaller = Get-ChildItem $nsisInstall -Recurse -Filter 'uninstall.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'NSIS installation did not create an uninstaller.' }
          $uninstallProcess = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "NSIS uninstall failed with exit code $($uninstallProcess.ExitCode)." }

      - name: Upload verified Windows setup package
        uses: actions/upload-artifact@v4
        with:
          name: RackTop_${{ env.RACKTOP_VERSION }}_x64-setup
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig

      - name: Upload verified Windows MSI package
        uses: actions/upload-artifact@v4
        with:
          name: RackTop_${{ env.RACKTOP_VERSION }}_x64_zh-CN-msi
          if-no-files-found: error
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
