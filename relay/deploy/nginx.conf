limit_req_zone $binary_remote_addr zone=racktop_requests:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=racktop_connections:1m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/racktop-relay-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/racktop-relay-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RackTopTLS:1m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    access_log off;
    client_max_body_size 2k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn racktop_connections 40;

    location / {
        limit_req zone=racktop_requests burst=30 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
